<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document Upload - RAG Knowledge Base</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            padding: 40px 20px;
        }
        .container {
            max-width: 800px;
            margin: 0 auto;
            background: white;
            border-radius: 20px;
            padding: 40px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
        }
        h1 {
            color: #333;
            margin-bottom: 10px;
        }
        .subtitle {
            color: #666;
            margin-bottom: 30px;
        }
        .upload-section {
            border: 2px dashed #ddd;
            border-radius: 12px;
            padding: 40px;
            text-align: center;
            margin-bottom: 30px;
            transition: all 0.3s;
        }
        .upload-section:hover {
            border-color: #667eea;
            background: #f8f9ff;
        }
        .upload-section.dragover {
            border-color: #667eea;
            background: #f0f2ff;
        }
        input[type="file"] {
            display: none;
        }
        .upload-btn {
            padding: 15px 30px;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
            border: none;
            border-radius: 10px;
            font-size: 16px;
            font-weight: 600;
            cursor: pointer;
            transition: transform 0.2s;
        }
        .upload-btn:hover {
            transform: translateY(-2px);
        }
        .config {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .config input {
            flex: 1;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            font-size: 14px;
        }
        .documents-list {
            margin-top: 30px;
        }
        .documents-list h2 {
            font-size: 20px;
            margin-bottom: 15px;
            color: #333;
        }
        .document-item {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 10px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .document-info {
            flex: 1;
        }
        .document-name {
            font-weight: 600;
            color: #333;
            margin-bottom: 5px;
        }
        .document-meta {
            font-size: 12px;
            color: #666;
        }
        .delete-btn {
            padding: 8px 16px;
            background: #dc3545;
            color: white;
            border: none;
            border-radius: 6px;
            cursor: pointer;
            font-size: 13px;
        }
        .delete-btn:hover {
            background: #c82333;
        }
        .status {
            padding: 12px;
            border-radius: 8px;
            margin-bottom: 20px;
            text-align: center;
            font-size: 14px;
        }
        .status.success {
            background: #d4edda;
            color: #155724;
        }
        .status.error {
            background: #f8d7da;
            color: #721c24;
        }
        .status.info {
            background: #d1ecf1;
            color: #0c5460;
        }
        .hidden {
            display: none;
        }
        .test-section {
            margin-top: 30px;
            padding: 20px;
            background: #f8f9fa;
            border-radius: 12px;
        }
        .test-section h3 {
            margin-bottom: 15px;
            color: #333;
        }
        .test-input {
            width: 100%;
            padding: 12px;
            border: 1px solid #ddd;
            border-radius: 8px;
            margin-bottom: 10px;
            font-size: 14px;
        }
        .test-btn {
            padding: 10px 20px;
            background: #28a745;
            color: white;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-size: 14px;
        }
        .test-result {
            margin-top: 15px;
            padding: 15px;
            background: white;
            border-radius: 8px;
            white-space: pre-wrap;
            font-size: 13px;
            color: #333;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>📚 RAG Knowledge Base</h1>
        <p class="subtitle">Upload documents to train your AI chatbot</p>

        <div class="config">
            <input type="text" id="tenantId" placeholder="Tenant ID" value="tenant1">
            <input type="text" id="apiUrl" placeholder="API URL" value="http://localhost:8000">
        </div>

        <div id="status" class="status hidden"></div>

        <div class="upload-section" id="dropZone">
            <p style="font-size: 48px; margin-bottom: 15px;">📄</p>
            <p style="font-size: 16px; color: #666; margin-bottom: 20px;">
                Drag & drop your document here or click to browse
            </p>
            <p style="font-size: 13px; color: #999; margin-bottom: 20px;">
                Supported: PDF, TXT, DOCX
            </p>
            <input type="file" id="fileInput" accept=".pdf,.txt,.docx">
            <button class="upload-btn" onclick="document.getElementById('fileInput').click()">
                Choose File
            </button>
        </div>

        <div class="documents-list">
            <h2>Uploaded Documents</h2>
            <div id="documentsList">
                <p style="color: #999; text-align: center; padding: 20px;">No documents uploaded yet</p>
            </div>
        </div>

        <div class="test-section">
            <h3>🧪 Test RAG Retrieval</h3>
            <input type="text" class="test-input" id="testQuery" placeholder="Ask a question about your documents...">
            <button class="test-btn" onclick="testRetrieval()">Test Search</button>
            <div id="testResult" class="test-result hidden"></div>
        </div>
    </div>

    <script>
        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');

        // Drag and drop
        dropZone.addEventListener('dragover', (e) => {
            e.preventDefault();
            dropZone.classList.add('dragover');
        });

        dropZone.addEventListener('dragleave', () => {
            dropZone.classList.remove('dragover');
        });

        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            const files = e.dataTransfer.files;
            if (files.length > 0) {
                uploadFile(files[0]);
            }
        });

        fileInput.addEventListener('change', (e) => {
            if (e.target.files.length > 0) {
                uploadFile(e.target.files[0]);
            }
        });

        async function uploadFile(file) {
            const tenantId = document.getElementById('tenantId').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const statusEl = document.getElementById('status');

            statusEl.textContent = `Uploading ${file.name}...`;
            statusEl.className = 'status info';

            const formData = new FormData();
            formData.append('file', file);

            try {
                const response = await fetch(`${apiUrl}/api/v1/documents/upload`, {
                    method: 'POST',
                    headers: {
                        'X-Tenant-Id': tenantId
                    },
                    body: formData
                });

                if (!response.ok) {
                    throw new Error(`Upload failed: ${response.statusText}`);
                }

                const data = await response.json();
                statusEl.textContent = `✓ ${data.message}`;
                statusEl.className = 'status success';

                // Reload documents list
                loadDocuments();

                // Clear file input
                fileInput.value = '';

            } catch (error) {
                statusEl.textContent = `✗ Error: ${error.message}`;
                statusEl.className = 'status error';
            }
        }

        async function loadDocuments() {
            const tenantId = document.getElementById('tenantId').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const listEl = document.getElementById('documentsList');

            try {
                const response = await fetch(`${apiUrl}/api/v1/documents`, {
                    headers: {
                        'X-Tenant-Id': tenantId
                    }
                });

                const data = await response.json();

                if (data.documents.length === 0) {
                    listEl.innerHTML = '<p style="color: #999; text-align: center; padding: 20px;">No documents uploaded yet</p>';
                    return;
                }

                listEl.innerHTML = data.documents.map(doc => `
                    <div class="document-item">
                        <div class="document-info">
                            <div class="document-name">📄 ${doc.filename}</div>
                            <div class="document-meta">${doc.chunks} chunks • ID: ${doc.doc_id.substring(0, 8)}...</div>
                        </div>
                        <button class="delete-btn" onclick="deleteDocument('${doc.doc_id}')">Delete</button>
                    </div>
                `).join('');

            } catch (error) {
                console.error('Error loading documents:', error);
            }
        }

        async function deleteDocument(docId) {
            if (!confirm('Delete this document?')) return;

            const tenantId = document.getElementById('tenantId').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const statusEl = document.getElementById('status');

            try {
                const response = await fetch(`${apiUrl}/api/v1/documents/${docId}`, {
                    method: 'DELETE',
                    headers: {
                        'X-Tenant-Id': tenantId
                    }
                });

                if (!response.ok) {
                    throw new Error('Delete failed');
                }

                statusEl.textContent = '✓ Document deleted';
                statusEl.className = 'status success';

                loadDocuments();

            } catch (error) {
                statusEl.textContent = `✗ Error: ${error.message}`;
                statusEl.className = 'status error';
            }
        }

        async function testRetrieval() {
            const query = document.getElementById('testQuery').value;
            const tenantId = document.getElementById('tenantId').value;
            const apiUrl = document.getElementById('apiUrl').value;
            const resultEl = document.getElementById('testResult');

            if (!query) {
                alert('Please enter a question');
                return;
            }

            resultEl.textContent = 'Searching...';
            resultEl.classList.remove('hidden');

            try {
                // Test by sending a chat message
                const response = await fetch(`${apiUrl}/api/v1/chat`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        'X-Tenant-Id': tenantId
                    },
                    body: JSON.stringify({
                        phone_number: '+test-rag',
                        message: query
                    })
                });

                const data = await response.json();
                resultEl.textContent = `AI Response:\n${data.response}`;

            } catch (error) {
                resultEl.textContent = `Error: ${error.message}`;
            }
        }

        // Load documents on page load
        loadDocuments();
    </script>
</body>
</html>
